[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-issue-tracker"
version = "1.0.0"
description = "A simple Python CLI issue tracker"
requires-python = ">=3.13"

[project.scripts]
issue-tracker = "main:main"

[tool.setuptools]
py-modules = ["main", "tracker", "storage"]